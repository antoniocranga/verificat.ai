groups:
  - name: system_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value | printf \"%.2f\" }}% on instance {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on {{ $labels.instance }}"
          description: "Memory usage is at {{ $value | printf \"%.2f\" }}% on instance {{ $labels.instance }}."

      - alert: ContainerDown
        expr: container_last_seen{container_label_com_docker_compose_service!=""} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} down"
          description: "Container {{ $labels.container }} has been down for more than 1 minute."

      - alert: MockSessionDetected
        expr: increase(stt_mock_sessions_total{environment="production"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Mock STT Session Detected in Production"
          description: "A mock STT session was triggered in the production environment. Check API keys!"

      - alert: HighFactcheckErrorRate
        expr: sum(rate(factcheck_requests_total{environment="production", outcome="error"}[5m])) / sum(rate(factcheck_requests_total{environment="production"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Fact-Check Error Rate in Production"
          description: "More than 10% of fact-check requests failed in the last 5 minutes in production."
